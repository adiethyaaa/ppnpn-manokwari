<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Presensi Pegawai v.15</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a5276'/><path d='M25 18h32l18 18v46H25z' fill='white'/><path d='M57 18v18h18' fill='%23d5dbdb'/><rect x='34' y='52' width='7' height='18' rx='2' fill='%233498db'/><rect x='46' y='42' width='7' height='28' rx='2' fill='%232ecc71'/><rect x='58' y='34' width='7' height='36' rx='2' fill='%23f1c40f'/></svg>">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 1. SDK Firebase (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- 💡 SKRIP WAJIB FIREBASE AUTH -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- 2. Firebase Config (Menyediakan objek firebaseConfig) -->
    <script src="js/firebase-config.js?v=1"></script>
    <!-- 3. Auth Logic -->
    <script src="js/auth.js"></script>
</head>

<body>
    <div id="login-page">
        <div class="login-card">
            <div class="login-logos">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Logo_Badan_Kepegawaian_Negara.png/960px-Logo_Badan_Kepegawaian_Negara.png" alt="Logo BKN">
                <img src="https://webinar.tu-kanreg14.id/assets/img/logo_kasuari.png" alt="Logo Kasuari">
            </div>
            <h2>Laporan Presensi Pegawai</h2>
            <p>Kantor Regional XIV BKN Manokwari</p>
            <form onsubmit="event.preventDefault(); prosesLogin();">
                <input type="text" id="loginUsername" class="login-input" placeholder="Username" required autocomplete="username">
                <input type="password" id="loginPassword" class="login-input" placeholder="Password" required autocomplete="current-password">
                <button type="submit" id="btnLoginSubmit" class="login-btn">Log In</button>
            </form>
            <div class="login-footer">made with <span><3</span> by aditya</div>
        </div>
    </div>

    
</body>
</html>
