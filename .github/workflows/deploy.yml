name: Deploy Application

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 💡 Membuat folder js/ dan menginjeksi 8 Secret secara presisi ke js/firebase-config.js
      - name: Generate firebase-config.js from Secrets
        env:
          CFG_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          CFG_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          CFG_DB_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          CFG_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CFG_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          CFG_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          CFG_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          CFG_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          mkdir -p js
          printf 'const firebaseConfig = {\n  apiKey: "%s",\n  authDomain: "%s",\n  databaseURL: "%s",\n  projectId: "%s",\n  storageBucket: "%s",\n  messagingSenderId: "%s",\n  appId: "%s",\n  measurementId: "%s"\n};\n\nif (typeof firebase !== "undefined" && !firebase.apps.length) {\n  firebase.initializeApp(firebaseConfig);\n}\n\nvar db = (typeof firebase !== "undefined" && firebase.apps.length) ? firebase.database() : null;\nvar database = db;\n' \
          "$CFG_API_KEY" \
          "$CFG_AUTH_DOMAIN" \
          "$CFG_DB_URL" \
          "$CFG_PROJECT_ID" \
          "$CFG_STORAGE_BUCKET" \
          "$CFG_SENDER_ID" \
          "$CFG_APP_ID" \
          "$CFG_MEASUREMENT_ID" > js/firebase-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4